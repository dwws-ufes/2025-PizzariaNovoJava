services:
  ontop:
    build: .
    ports:
      - "8081:8080"
    volumes:
      - ./mapping.ttl:/opt/ontop/mapping.ttl
      - ./ontology.properties:/opt/ontop/ontology.properties
    environment:
      ONTOP_MAPPING_FILE: /opt/ontop/mapping.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/ontology.properties
      ONTOP_EXTRA_CLASSPATH: /opt/ontop/jdbc/postgresql.jar
    extra_hosts:
      - "host.docker.internal:host-gateway"
