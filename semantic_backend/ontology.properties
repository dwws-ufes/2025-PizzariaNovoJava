# ========================================
# CONFIGURAÇÃO ONTOP PARA PIZZARIA
# ========================================

# Configuração da conexão JDBC com PostgreSQL
jdbc.url=jdbc:postgresql://dwss-postgresql:5432/postgres
jdbc.driver=org.postgresql.Driver
jdbc.user=admin
jdbc.password=admin

# Configurações de logging
logging.level.it.unibz.inf.ontop=INFO
logging.level.org.semanticweb.owlapi=INFO

# Configurações de performance
ontop.cardinalityMode=LOOSE
ontop.enableTestConnection=true

# Configurações de cache
ontop.queryCache=true
ontop.queryTimeout=30

# Configurações de mapeamento
ontop.sameAsInMappings=true
ontop.enableIRISafeEncoding=true

# Configurações de SPARQL endpoint
ontop.sparql.defaultGraphIri=http://localhost:8081/pizzaria/
ontop.sparql.enableCrossOrigin=true

# Configurações de metadados
ontop.metadataExtractionEnabled=true
ontop.dbMetadataCache=true

# Configurações de otimização
ontop.optimization=true
ontop.existentialReasoning=true
