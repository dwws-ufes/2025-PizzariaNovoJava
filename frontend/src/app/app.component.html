<div class="aplicacao" *ngIf="role === 'Administrador'">
  <!--<div class="aplicacao">-->
  <app-topbar [configuracaoMenuLateral]="configuracaoMenuLateral"></app-topbar>
  <div class="corpo-aplicacao">
    <app-sidemenu [configuracaoMenuLateral]="configuracaoMenuLateral"></app-sidemenu>
    <div class="conteudo-principal">
      <div class="container list col-12">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>

<div class="aplicacao" *ngIf="!role">
  <div class="conteudo-principal">
    <div class="container list col-12">
      <app-login-view></app-login-view>
    </div>
  </div>
</div>

<div class="aplicacao">
  <app-topbar [configuracaoMenuLateral]="configuracaoMenuLateral"></app-topbar>
  <div class="corpo-aplicacao">
    <div class="conteudo-principal">
      <div class="container list col-12" *ngIf="role === 'Garçom'">
        <p-tabView>
          <p-tabPanel header="Fazer Pedidos">
            <app-painel-garcom></app-painel-garcom>
          </p-tabPanel>
          <p-tabPanel header="Lista de pedidos">
            <app-pizza-painel></app-pizza-painel>

          </p-tabPanel>
        </p-tabView>
      </div>
      <div class="container list col-12" *ngIf="role === 'Caixa'">
      </div>
      <div class="container list col-12" *ngIf="role === 'Pizzaiolo'">
        <app-cozinha></app-cozinha>
      </div>
      <div class="container list col-12" *ngIf="role === 'Barman'">
        <app-bar></app-bar>
      </div>
      <div class="container list col-12" *ngIf="role === 'Cliente'">
      </div>
    </div>
  </div>
</div>


<p-confirmDialog #dialogDelete [baseZIndex]="99999">
  <div class="p-col-12">
    <div class="p-col-6">
      <button pButton icon="pi pi-close" label="Não"
              (click)="dialogDelete.reject()"></button>
    </div>
    <div class="p-col-6">
      <button pButton icon="pi pi-save" label="Sim"
              (click)="dialogDelete.accept()"></button>
    </div>
  </div>
</p-confirmDialog>

<p-toast></p-toast>
