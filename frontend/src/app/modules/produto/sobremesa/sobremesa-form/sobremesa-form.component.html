<div class="form p-fluid p-grid">
  <form [formGroup]="formGroup">

    <div class="area-field flex pt-2 col-12">
      <div class="item-field col-12">
        <span class="item-form">
          <label class="campo" for="nome">Nome da Sobremesa</label>
          <input type="text" id="nome" pInputText formControlName="nome" [class.invalid]="isFieldInvalid('nome')">
          <small *ngIf="isFieldInvalid('nome')" class="p-error">Nome é obrigatório</small>
        </span>
      </div>
    </div>

    <div class="area-field flex col-12">
      <div class="item-field col-12">
        <span class="item-form">
          <label class="campo" for="descricao">Descrição</label>
          <textarea id="descricao" pInputTextarea formControlName="descricao" rows="3"
                    [class.invalid]="isFieldInvalid('descricao')"></textarea>
          <small *ngIf="isFieldInvalid('descricao')" class="p-error">Descrição é obrigatória</small>
        </span>
      </div>
    </div>

    <div class="area-field flex col-12">
      <div class="item-field col-6">
        <span class="item-form">
          <label class="campo">Preço de Venda R$</label>
          <p-inputNumber formControlName="precoVenda" mode="currency" locale="pt-BR" currency="BRL" [min]="0.01"
                         [class.invalid]="isFieldInvalid('precoVenda')"></p-inputNumber>
          <small *ngIf="isFieldInvalid('precoVenda')" class="p-error">Preço deve ser maior que zero</small>
        </span>
      </div>
    </div>

    <div class="area-field flex justify-content-end gap-2 mt-3 col-12">
      <button pButton type="button" label="Cancelar" icon="pi pi-times" class="p-button-secondary"
              (click)="closeForm()"></button>
      <button pButton type="button" label="Salvar" icon="pi pi-check" class="p-button-primary"
              (click)="saveForm()" [disabled]="formGroup.invalid"></button>
    </div>
  </form>
</div>
