<div class="pagina flex flex-column col-12">
  <div class="item-pagina botoes">
    <button pButton type="button"
            icon="pi pi-plus"
            class="button-action ui-button-success button-save-new"
            iconPos="left"
            label="Cadastrar Sobremesa"
            (click)="registerSobremesa()">
    </button>
  </div>

  <custom-table [colunas]="columns"
                [dados]="sobremesasList"
                [paginator]="true"
                [rows]="12"
                [editarDado]="true"
                [desativarDado]="true"
                (abrirModalHabilitado)="editSobremesa($event)"
                (deletarDado)="confirmAction($event)">
  </custom-table>
</div>

<custom-dialog [display]="display"
               [header]="titleDialog"
               (answerForm)="onSave()"
               (closeDialog)="onClose()">
  <app-sobremesa-form></app-sobremesa-form>
</custom-dialog>
