<div class="pagina flex flex-column col-12">
  <div class="item-pagina-list col-12">
    <span class="titulo">Cozinha - Pedidos</span>
  </div>

  <div class="list-card">
    <p-card *ngFor="let item of pizzasList" header="Pedido #{{ item.pedidoId }}">
      <div class="flex flex-column sm:flex-row justify-content-between align-items-center mb-3">
        <p-badge
          [value]="getStatusText(item.statusPratoId)"
          [styleClass]="getStatusClass(item.statusPratoId) + ' border-round'"
        >{{ getStatusDescricao(item.statusPratoId) }}</p-badge>
        <small class="text-gray-500">{{ item.dataHora }}</small>
      </div>

      <div class="grid grid-nogutter md:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
        <div>
          <b>Cliente:</b> {{ item.nomeCliente }}
        </div>
        <div>
          <b>Bebida:</b> {{ item.nomePizza }}
        </div>
        <div>
          <b>Quantidade:</b> ({{ item.quantidade }})
        </div>
      </div>

      <div *ngIf="item.observacao" class="mt-3">
        <p class="text-gray-600 mb-1"><b>Observações:</b></p>
        <div class="bg-gray-100 p-2 border-round">{{ item.observacao }}</div>
      </div>

      <div class="mt-3 flex flex-wrap gap-2">
        <button pButton label="Alterar Status" class="p-button-outlined p-button-sm" (click)="abrirModalStatus(item)"></button>
      </div>
    </p-card>
    <div *ngIf="pizzasList.length == 0" class="msg">
      <span>Nenhuma bebida pendente</span>
    </div>
  </div>
</div>

<!-- Modal de Status -->
<p-dialog header="Alterar Status do Pedido" [(visible)]="displayModalStatus"
          [style]="{ width: '550px', height: '396px' }" [modal]="true" [draggable]="false" [resizable]="false">
  <div class="p-fluid">
    <div class="p-field">
      <label>Novo Status</label>
      <p-dropdown
        [options]="opcoesStatus"
        [(ngModel)]="statusSelecionado"
        optionLabel="titulo"
        optionValue="index"
        [style]="{width: '100%'}">
      </p-dropdown>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancelar" icon="pi pi-times"
            class="p-button-text" (click)="fecharModalStatus()"></button>
    <button pButton type="button" label="Confirmar" icon="pi pi-check"
            class="p-button-primary" (click)="confirmarAlteracaoStatus()"></button>
  </ng-template>
</p-dialog>
